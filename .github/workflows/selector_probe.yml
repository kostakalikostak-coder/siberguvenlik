name: Selector Keşfi (teşhis)

# Elle tetiklenen teşhis: feed-özet fallback'in kurtaramadığı kaynaklar için doğru
# CONTENT_SELECTORS'ı gerçek runner IP'sinde (üretim) makale sayfasını kazıyarak bulur.
# Rapor üretmez, commit'lemez. Çalıştır: Actions → "Selector Keşfi (teşhis)" → Run.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    # 23 hedef × (feed + makale sayfası) isteği; yavaş/timeout'a düşen kaynaklar
    # hedef başına ~30s'ye kadar çıkabiliyor. 6 dk ölçümü ortasında keserdi.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -u scripts/selector_probe.py
      # Seçici doğru olduğu hâlde üretimde kaybolan kaynaklar için ÇEKİM teşhisi:
      # üretimin timeout/retry/10s-sınır koşullarını birebir taklit eder.
      - run: python -u scripts/fetch_probe.py
